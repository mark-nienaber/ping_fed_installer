<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="800" viewBox="0 0 1040 800" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif"><title>Integrated Ping stack the installer builds</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1 L9,5 L0,9 z" fill="#5a6b7a"/></marker><marker id="as" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M9,1 L0,5 L9,9 z" fill="#5a6b7a"/></marker></defs><rect width="1040" height="800" fill="#ffffff"/><text x="520.0" y="32" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="17" fill="#16202b" text-anchor="middle" font-weight="700">The stack the installer builds</text><text x="520.0" y="50" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="11" fill="#8b9aa8" text-anchor="middle" font-weight="400" font-style="italic">One host, three products, wired the way a customer runs them — sessions and grants kept in the directory</text><rect x="410.0" y="74" width="220" height="44" rx="7" fill="#ffffff" fill-opacity="1.0" stroke="#5a6b7a" stroke-width="1.5"/><text x="520.0" y="101.0" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" fill="#16202b" text-anchor="middle" font-weight="600">Browser</text><rect x="300.0" y="156" width="440" height="66" rx="7" fill="#f7ede2" fill-opacity="1.0" stroke="#b06a2c" stroke-width="1.5"/><text x="520.0" y="186.0" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" fill="#16202b" text-anchor="middle" font-weight="600">PingAccess</text><text x="520.0" y="203.0" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="10.5" fill="#5a6b7a" text-anchor="middle" font-weight="400">enforcement point  ·  vhost app.example.com</text><rect x="655.8" y="163" width="76.2" height="17" rx="5" fill="#fff" fill-opacity="1.0" stroke="#b06a2c" stroke-width="1.2"/><text x="693.9" y="175" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="9.5" fill="#b06a2c" text-anchor="middle" font-weight="700" letter-spacing="0.06em">9000 / 3000</text><rect x="300.0" y="288" width="440" height="66" rx="7" fill="#e2f1f2" fill-opacity="1.0" stroke="#0e7c86" stroke-width="1.5"/><text x="520.0" y="318.0" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" fill="#16202b" text-anchor="middle" font-weight="600">PingFederate</text><text x="520.0" y="335.0" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="10.5" fill="#5a6b7a" text-anchor="middle" font-weight="400">OAuth 2.0 / OIDC token service  ·  IdP adapter</text><rect x="655.8" y="295" width="76.2" height="17" rx="5" fill="#fff" fill-opacity="1.0" stroke="#0e7c86" stroke-width="1.2"/><text x="693.9" y="307" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="9.5" fill="#0e7c86" text-anchor="middle" font-weight="700" letter-spacing="0.06em">9999 / 9031</text><rect x="294.0" y="420" width="452" height="250" rx="11" fill="#f6f9fb" fill-opacity="1.0" stroke="#2f7d52" stroke-width="1.6"/><text x="310.0" y="442" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="11.5" fill="#5a6b7a" text-anchor="start" font-weight="700" letter-spacing="0.10em">PINGDIRECTORY — DATA + SESSION STORE</text><rect x="318.0" y="460" width="404" height="40" rx="6" fill="#ffffff" fill-opacity="1.0" stroke="#2f7d52" stroke-width="1.3"/><text x="334.0" y="484" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#16202b" text-anchor="start" font-weight="700">ou=people</text><text x="706.0" y="484" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="10.5" fill="#5a6b7a" text-anchor="end" font-weight="400">end users</text><rect x="318.0" y="510" width="404" height="40" rx="6" fill="#ffffff" fill-opacity="1.0" stroke="#2f7d52" stroke-width="1.3"/><text x="334.0" y="534" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#16202b" text-anchor="start" font-weight="700">ou=applications</text><text x="706.0" y="534" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="10.5" fill="#5a6b7a" text-anchor="end" font-weight="400">cn=pingfederate service acct</text><rect x="318.0" y="560" width="404" height="40" rx="6" fill="#ffffff" fill-opacity="1.0" stroke="#2f7d52" stroke-width="1.3"/><text x="334.0" y="584" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#16202b" text-anchor="start" font-weight="700">ou=AuthenticationSessions</text><text x="706.0" y="584" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="10.5" fill="#5a6b7a" text-anchor="end" font-weight="400">PF SSO sessions</text><rect x="318.0" y="610" width="404" height="40" rx="6" fill="#ffffff" fill-opacity="1.0" stroke="#2f7d52" stroke-width="1.3"/><text x="334.0" y="634" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#16202b" text-anchor="start" font-weight="700">ou=AccessGrant</text><text x="706.0" y="634" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="10.5" fill="#5a6b7a" text-anchor="end" font-weight="400">PF OAuth grants</text><text x="520.0" y="688" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="11" fill="#8b9aa8" text-anchor="middle" font-weight="400" font-style="italic">LDAP 1389  ·  LDAPS 1636 (+ admin connector)  ·  HTTPS 1443 (Admin API / SCIM)</text><line x1="520.0" y1="118" x2="520.0" y2="156" stroke="#5a6b7a" stroke-width="1.8" stroke-opacity="1.0" marker-end="url(#a)"/><rect x="454.55" y="127" width="130.9" height="17" rx="4" fill="#ffffff" fill-opacity="1.0" stroke="#ffffff" stroke-width="0"/><text x="520.0" y="139.5" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="10.5" fill="#5a6b7a" text-anchor="middle" font-weight="600">1 · GET protected app</text><line x1="520.0" y1="222" x2="520.0" y2="288" stroke="#5a6b7a" stroke-width="1.8" stroke-opacity="1.0" marker-end="url(#a)"/><rect x="428.0" y="244" width="184.0" height="17" rx="4" fill="#ffffff" fill-opacity="1.0" stroke="#ffffff" stroke-width="0"/><text x="520.0" y="256.5" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="10.5" fill="#5a6b7a" text-anchor="middle" font-weight="600">2 · no session → OIDC redirect</text><path d="M 450.0 354 L 450.0 420" fill="none" stroke="#5a6b7a" stroke-width="1.6" stroke-opacity="1.0" marker-end="url(#a)"/><rect x="396.35" y="377" width="107.30000000000001" height="17" rx="4" fill="#ffffff" fill-opacity="1.0" stroke="#ffffff" stroke-width="0"/><text x="450.0" y="389.5" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="10.5" fill="#5a6b7a" text-anchor="middle" font-weight="600">3 · bind + search</text><path d="M 590.0 354 L 590.0 420" fill="none" stroke="#5a6b7a" stroke-width="1.6" stroke-opacity="1.0" marker-end="url(#a)"/><rect x="503.9" y="377" width="172.20000000000002" height="17" rx="4" fill="#ffffff" fill-opacity="1.0" stroke="#ffffff" stroke-width="0"/><text x="590.0" y="389.5" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="10.5" fill="#5a6b7a" text-anchor="middle" font-weight="600">4 · persist session + grants</text><rect x="300.0" y="710" width="440" height="67.25" rx="7" fill="#f4f3fa" fill-opacity="1.0" stroke="#f4f3fa" stroke-width="0"/><rect x="300.0" y="710" width="4" height="67.25" rx="2" fill="#5b4b9a" fill-opacity="1.0" stroke="#5b4b9a" stroke-width="0"/><text x="318.0" y="730" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="10.5" fill="#5b4b9a" text-anchor="start" font-weight="700">Why sessions live in the directory</text><text x="318.0" y="745.75" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="10.5" fill="#16202b" text-anchor="start" font-weight="400">In-memory sessions die on every restart and cannot be shared across engines. Writing</text><text x="318.0" y="760.975" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="10.5" fill="#16202b" text-anchor="start" font-weight="400">them to PingDirectory makes SSO durable and cluster-ready.</text></svg>