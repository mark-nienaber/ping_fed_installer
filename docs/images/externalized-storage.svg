<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="430" viewBox="0 0 1120 430" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif"><title>In-memory vs externalized session storage</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1 L9,5 L0,9 z" fill="#5a6b7a"/></marker><marker id="as" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M9,1 L0,5 L9,9 z" fill="#5a6b7a"/></marker></defs><rect width="1120" height="430" fill="#ffffff"/><text x="560.0" y="32" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="17" fill="#16202b" text-anchor="middle" font-weight="700">Where PingFederate keeps its sessions</text><text x="560.0" y="50" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="11" fill="#8b9aa8" text-anchor="middle" font-weight="400" font-style="italic">The single toggle PINGFED_SESSION_STORAGE decides whether the stack is dev-grade or production-grade</text><rect x="40.0" y="92" width="506.0" height="205" rx="10" fill="#ffffff" fill-opacity="1.0" stroke="#b3413e" stroke-width="1.6"/><rect x="40.0" y="92" width="506.0" height="30" rx="10" fill="#fdecec" fill-opacity="1.0" stroke="#b3413e" stroke-width="1.6"/><rect x="40.0" y="114" width="506.0" height="8" rx="0" fill="#fdecec" fill-opacity="1.0" stroke="#fdecec" stroke-width="0"/><text x="293.0" y="112" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="11.5" fill="#b3413e" text-anchor="middle" font-weight="700" letter-spacing="0.04em">MEMORY  —  dev only</text><rect x="574.0" y="92" width="506.0" height="205" rx="10" fill="#ffffff" fill-opacity="1.0" stroke="#2f7d52" stroke-width="1.6"/><rect x="574.0" y="92" width="506.0" height="30" rx="10" fill="#e7f3ec" fill-opacity="1.0" stroke="#2f7d52" stroke-width="1.6"/><rect x="574.0" y="114" width="506.0" height="8" rx="0" fill="#e7f3ec" fill-opacity="1.0" stroke="#e7f3ec" stroke-width="0"/><text x="827.0" y="112" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="11.5" fill="#2f7d52" text-anchor="middle" font-weight="700" letter-spacing="0.04em">PINGDIRECTORY  —  production pattern</text><text x="60" y="152.0" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="11" fill="#16202b" text-anchor="start" font-weight="400">Sessions and OAuth grants live in the PingFederate JVM heap.</text><text x="60" y="196" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" fill="#b3413e" text-anchor="start" font-weight="700">✗</text><text x="82" y="196" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="10.5" fill="#16202b" text-anchor="start" font-weight="400">Lost on every restart — users re-authenticate</text><text x="60" y="226" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" fill="#b3413e" text-anchor="start" font-weight="700">✗</text><text x="82" y="226" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="10.5" fill="#16202b" text-anchor="start" font-weight="400">Cannot be shared across engine nodes</text><text x="60" y="256" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" fill="#b3413e" text-anchor="start" font-weight="700">✗</text><text x="82" y="256" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="10.5" fill="#16202b" text-anchor="start" font-weight="400">Blocks horizontal scaling of the runtime</text><text x="594.0" y="152.0" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="11" fill="#16202b" text-anchor="start" font-weight="400">Sessions and grants are written to the replicated directory.</text><text x="594.0" y="196" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" fill="#2f7d52" text-anchor="start" font-weight="700">✓</text><text x="616.0" y="196" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="10.5" fill="#16202b" text-anchor="start" font-weight="400">Durable across PingFederate restarts</text><text x="594.0" y="226" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" fill="#2f7d52" text-anchor="start" font-weight="700">✓</text><text x="616.0" y="226" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="10.5" fill="#16202b" text-anchor="start" font-weight="400">Shared by every engine — any node serves any user</text><text x="594.0" y="256" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" fill="#2f7d52" text-anchor="start" font-weight="700">✓</text><text x="616.0" y="256" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="10.5" fill="#16202b" text-anchor="start" font-weight="400">Indexed + least-privilege service-account bind</text><rect x="40" y="370" width="1040" height="67.25" rx="7" fill="#f4f3fa" fill-opacity="1.0" stroke="#f4f3fa" stroke-width="0"/><rect x="40" y="370" width="4" height="67.25" rx="2" fill="#5b4b9a" fill-opacity="1.0" stroke="#5b4b9a" stroke-width="0"/><text x="58" y="390" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="10.5" fill="#5b4b9a" text-anchor="start" font-weight="700">One toggle in pingconfig.env</text><text x="58" y="405.75" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="10.5" fill="#16202b" text-anchor="start" font-weight="400">PINGFED_SESSION_STORAGE = pingdirectory | memory. The installer defaults to pingdirectory and provisions the ou=AuthenticationSessions and ou=AccessGrant containers, the service-account ACIs, and the</text><text x="58" y="420.975" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="10.5" fill="#16202b" text-anchor="start" font-weight="400">grant indexes to back it.</text></svg>