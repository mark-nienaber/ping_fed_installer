700" letter-spacing="0.10em">PINGDIRECTORY REPLICATION</text><rect x="322" y="510" width="230" height="84" rx="7" fill="#e7f3ec" fill-opacity="1.0" stroke="#2f7d52" stroke-width="1.5"/><text x="437.0" y="549.0" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" fill="#16202b" text-anchor="middle" font-weight="600">node 1</text><text x="437.0" y="566.0" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="10" fill="#5a6b7a" text-anchor="middle" font-weight="400">LDAPS :1636</text><rect x="568" y="510" width="230" height="84" rx="7" fill="#e7f3ec" fill-opacity="1.0" stroke="#2f7d52" stroke-width="1.5"/><text x="683.0" y="549.0" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" fill="#16202b" text-anchor="middle" font-weight="600">node 2</text><text x="683.0" y="566.0" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="10" fill="#5a6b7a" text-anchor="middle" font-weight="400">LDAPS :2636</text><path d="M 552 552 L 568 552" fill="none" stroke="#2f7d52" stroke-width="2" stroke-opacity="1.0" marker-end="url(#a)" marker-start="url(#as)"/><rect x="518.15" y="531" width="83.7" height="17" rx="4" fill="#ffffff" fill-opacity="1.0" stroke="#ffffff" stroke-width="0"/><text x="560" y="543.5" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="10.5" fill="#5a6b7a" text-anchor="middle" font-weight="600">dsreplication</text><text x="560" y="608" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="11" fill="#8b9aa8" text-anchor="middle" font-weight="400" font-style="italic">each node holds users · sessions · grants — writes replicate both ways</text><path d="M 750 358 L 750 442 L 437 442 L 437 508" fill="none" stroke="#0e7c86" stroke-width="1.5" stroke-opacity="1.0" stroke-dasharray="5 4" marker-end="url(#a)"/><path d="M 750 358 L 750 442 L 683 442 L 683 508" fill="none" stroke="#0e7c86" stroke-width="1.5" stroke-opacity="1.0" stroke-dasharray="5 4" marker-end="url(#a)"/><rect x="470.95" y="431" width="178.10000000000002" height="17" rx="4" fill="#ffffff" fill-opacity="1.0" stroke="#ffffff" stroke-width="0"/><text x="560" y="443.5" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="10.5" fill="#5a6b7a" text-anchor="middle" font-weight="600">LDAPS · both nodes · failover</text><rect x="40" y="674" width="1040" height="67.25" rx="7" fill="#e7f3ec" fill-opacity="1.0" stroke="#e7f3ec" stroke-width="0"/><rect x="40" y="674" width="4" height="67.25" rx="2" fill="#2f7d52" fill-opacity="1.0" stroke="#2f7d52" stroke-width="0"/><text x="58" y="694" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="10.5" fill="#2f7d52" text-anchor="start" font-weight="700">Secure + highly available</text><text x="58" y="709.75" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="10.5" fill="#16202b" text-anchor="start" font-weight="400">Every PF→PD link — the runtime datastore and the admin-console LDAP auth — is LDAPS with both directory nodes listed for failover, binding as the least-privilege cn=pingfederate service account. Stop node 1</text><text x="58" y="724.975" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="10.5" fill="#16202b" text-anchor="start" font-weight="400">mid-flow and SSO keeps working via node 2.</text></svg>