<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="740" viewBox="0 0 1120 740" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif"><title>Clustered / load-balanced topology</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1 L9,5 L0,9 z" fill="#5a6b7a"/></marker><marker id="as" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M9,1 L0,5 L9,9 z" fill="#5a6b7a"/></marker></defs><rect width="1120" height="740" fill="#ffffff"/><text x="560.0" y="32" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="17" fill="#16202b" text-anchor="middle" font-weight="700">Clustered mode — set the counts, get an HA stack</text><text x="560.0" y="50" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="11" fill="#8b9aa8" text-anchor="middle" font-weight="400" font-style="italic">PINGDIR_COUNT=2 · PINGFED_COUNT=2 · LB_ENABLED=true builds this instead of single-node</text><rect x="440.0" y="72" width="240" height="44" rx="7" fill="#ffffff" fill-opacity="1.0" stroke="#5a6b7a" stroke-width="1.5"/><text x="560.0" y="91.0" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12.5" fill="#16202b" text-anchor="middle" font-weight="600">Browser</text><text x="560.0" y="108.0" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="9.5" fill="#5a6b7a" text-anchor="middle" font-weight="400">https · :443</text><rect x="350.0" y="146" width="420" height="56" rx="7" fill="#ecebf6" fill-opacity="1.0" stroke="#5b4b9a" stroke-width="1.5"/><text x="560.0" y="171.0" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13.5" fill="#16202b" text-anchor="middle" font-weight="600">HAProxy load balancer</text><text x="560.0" y="188.0" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="10" fill="#5a6b7a" text-anchor="middle" font-weight="400">terminates client TLS on :443 · routes by 