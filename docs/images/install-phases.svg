<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="470" viewBox="0 0 1120 470" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif"><title>Three-phase installer flow</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1 L9,5 L0,9 z" fill="#5a6b7a"/></marker><marker id="as" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M9,1 L0,5 L9,9 z" fill="#5a6b7a"/></marker></defs><rect width="1120" height="470" fill="#ffffff"/><text x="560.0" y="32" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="17" fill="#16202b" text-anchor="middle" font-weight="700">Three re-runnable phases</text><text x="560.0" y="50" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="11" fill="#8b9aa8" text-anchor="middle" font-weight="400" font-style="italic">Driven by pingconfig.env · state tracked in .install-state · every step idempotent (check-then-create)</text><path d="M 40.0 92 L 367.3333333333333 92 L 381.3333333333333 124.0 L 367.3333333333333 156 L 40.0 156 Z" fill="#e2f1f2" stroke="#0e7c86" stroke-width="1.5"/><text x="210.66666666666666" y="122.0" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" fill="#16202b" text-anchor="middle" font-weight="600">Phase 1 · Install</text><text x="210.66666666666666" y="139.0" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="10" fill="#5a6b7a" text-anchor="middle" font-weight="400">unzip · license · baseline start</text><path d="M 389.3333333333333 92 L 716.6666666666666 92 L 730.6666666666666 124.0 L 716.6666666666666 156 L 389.3333333333333 156 L 403.3333333333333 124.0 Z" fill="#e2f1f2" stroke="#0e7c86" stroke-width="1.5"/><text x="567.0" y="122.0" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" fill="#16202b" text-anchor="middle" font-weight="600">Phase 2 · Configure</text><text x="567.0" y="139.0" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="10" fill="#5a6b7a" text-anchor="middle" font-weight="400">schema · datastore · adapters · clients</text><path d="M 738.6666666666666 92 L 1066.0 92 L 1080.0 124.0 L 1066.0 156 L 738.6666666666666 156 L 752.6666666666666 124.0 Z" fill="#e2f1f2" stroke="#0e7c86" stroke-width="1.5"/><text x="916.3333333333333" y="122.0" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" fill="#16202b" text-anchor="middle" font-weight="600">Phase 3 · Integrate</text><text x="916.3333333333333" y="139.0" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="10" fill="#5a6b7a" text-anchor="middle" font-weight="400">wire PA→PF · sample app · test users</text><rect x="40.0" y="186.0" width="337.3333333333333" height="76.6" rx="8" fill="#ffffff" fill-opacity="1.0" stroke="#c9d5de" stroke-width="1.4"/><rect x="40.0" y="196.0" width="3.5" height="56.599999999999994" rx="2" fill="#2f7d52" fill-opacity="1.0" stroke="#2f7d52" stroke-width="0"/><text x="54.0" y="208.0" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" fill="#16202b" text-anchor="start" font-weight="700">PingDirectory</text><text x="54.0" y="226.0" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="10" fill="#5a6b7a" text-anchor="start" font-weight="400">OUs, PF admin user + least-privilege service account, ACIs, PF</text><text x="54.0" y="240.5" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="10" fill="#5a6b7a" text-anchor="start" font-weight="400">schema, session + grant containers, and grant indexes.</text><rect x="391.3333333333333" y="186.0" width="337.3333333333333" height="76.6" rx="8" fill="#ffffff" fill-opacity="1.0" stroke="#c9d5de" stroke-width="1.4"/><rect x="391.3333333333333" y="196.0" width="3.5" height="56.599999999999994" rx="2" fill="#0e7c86" fill-opacity="1.0" stroke="#0e7c86" stroke-width="0"/><text x="405.3333333333333" y="208.0" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" fill="#16202b" text-anchor="start" font-weight="700">PingFederate</text><text x="405.3333333333333" y="226.0" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="10" fill="#5a6b7a" text-anchor="start" font-weight="400">LDAP admin auth, service-account datastore bind, externalized</text><text x="405.3333333333333" y="240.5" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="10" fill="#5a6b7a" text-anchor="start" font-weight="400">sessions + grants, IdP adapter, HTML-form PCV, OAuth / OIDC</text><text x="405.3333333333333" y="255.0" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="10" fill="#5a6b7a" text-anchor="start" font-weight="400">clients.</text><rect x="742.6666666666666" y="186.0" width="337.3333333333333" height="76.6" rx="8" fill="#ffffff" fill-opacity="1.0" stroke="#c9d5de" stroke-width="1.4"/><rect x="742.6666666666666" y="196.0" width="3.5" height="56.599999999999994" rx="2" fill="#b06a2c" fill-opacity="1.0" stroke="#b06a2c" stroke-width="0"/><text x="756.6666666666666" y="208.0" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" fill="#16202b" text-anchor="start" font-weight="700">PingAccess</text><text x="756.6666666666666" y="226.0" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="10" fill="#5a6b7a" text-anchor="start" font-weight="400">Accept SLA + rotate password, PingFederate token provider, virtual</text><text x="756.6666666666666" y="240.5" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="10" fill="#5a6b7a" text-anchor="start" font-weight="400">host, site, application, and the identity mapping to a header.</text><rect x="40" y="284.6" width="1040" height="67.25" rx="7" fill="#f4f3fa" fill-opacity="1.0" stroke="#f4f3fa" stroke-width="0"/><rect x="40" y="284.6" width="4" height="67.25" rx="2" fill="#5b4b9a" fill-opacity="1.0" stroke="#5b4b9a" stroke-width="0"/><text x="58" y="304.6" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="10.5" fill="#5b4b9a" text-anchor="start" font-weight="700">Dependency order</text><text x="58" y="320.35" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="10.5" fill="#16202b" text-anchor="start" font-weight="400">Products install in dependency order — the data store first, the token service second (it needs the directory), the gateway last (it needs the token service). Any phase re-runs safely; completed phases are skipped</text><text x="58" y="335.57500000000005" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="10.5" fill="#16202b" text-anchor="start" font-weight="400">unless --force is given.</text></svg>