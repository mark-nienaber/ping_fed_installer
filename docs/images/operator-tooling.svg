<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="430" viewBox="0 0 1120 430" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif"><title>Operator scripts that drive the stack</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1 L9,5 L0,9 z" fill="#5a6b7a"/></marker><marker id="as" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M9,1 L0,5 L9,9 z" fill="#5a6b7a"/></marker></defs><rect width="1120" height="430" fill="#ffffff"/><text x="560.0" y="32" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="17" fill="#16202b" text-anchor="middle" font-weight="700">One toolbox drives the whole system</text><text x="560.0" y="50" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="11" fill="#8b9aa8" text-anchor="middle" font-weight="400" font-style="italic">Every script is COUNT / LB_ENABLED aware — it manages exactly the components the config declares</text><rect x="40.0" y="92.0" width="249.5" height="76.6" rx="8" fill="#ffffff" fill-opacity="1.0" stroke="#c9d5de" stroke-width="1.4"/><rect x="40.0" y="102.0" width="3.5" height="56.599999999999994" rx="2" fill="#2f7d52" fill-opacity="1.0" stroke="#2f7d52" stroke-width="0"/><text x="54.0" y="114.0" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" fill="#16202b" text-anchor="start" font-weight="700">ping-setup.sh</text><text x="54.0" y="132.0" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="10" fill="#5a6b7a" text-anchor="start" font-weight="400">Host prerequisites: JDK 21, install user,</text><text x="54.0" y="146.5" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="10" fill="#5a6b7a" text-anchor="start" font-weight="400">directories, /etc/hosts, ulimits, and firewall ports.</text><rect x="303.5" y="92.0" width="249.5" height="76.6" rx="8" fill="#ffffff" fill-opacity="1.0" stroke="#c9d5de" stroke-width="1.4"/><rect x="303.5" y="102.0" width="3.5" height="56.599999999999994" rx="2" fill="#0e7c86" fill-opacity="1.0" stroke="#0e7c86" stroke-width="0"/><text x="317.5" y="114.0" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" fill="#16202b" text-anchor="start" font-weight="700">install_ping.sh</text><text x="317.5" y="132.0" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="10" fill="#5a6b7a" text-anchor="start" font-weight="400">The phased orchestrator — preflight, .install-state</text><text x="317.5" y="146.5" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="10" fill="#5a6b7a" text-anchor="start" font-weight="400">tracking, --phase1/2/3, --force, rollback.</text><rect x="567.0" y="92.0" width="249.5" height="76.6" rx="8" fill="#ffffff" fill-opacity="1.0" stroke="#c9d5de" stroke-width="1.4"/><rect x="567.0" y="102.0" width="3.5" height="56.599999999999994" rx="2" fill="#b06a2c" fill-opacity="1.0" stroke="#b06a2c" stroke-width="0"/><text x="581.0" y="114.0" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" fill="#16202b" text-anchor="start" font-weight="700">ping-control.sh</text><text x="581.0" y="132.0" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="10" fill="#5a6b7a" text-anchor="start" font-weight="400">Start / stop / restart / status for pd pd2 pf pf2 pa</text><text x="581.0" y="146.5" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="10" fill="#5a6b7a" text-anchor="start" font-weight="400">app lb — dependency-ordered, detached,</text><text x="581.0" y="161.0" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="10" fill="#5a6b7a" text-anchor="start" font-weight="400">port-aware.</text><rect x="830.5" y="92.0" width="249.5" height="76.6" rx="8" fill="#ffffff" fill-opacity="1.0" stroke="#c9d5de" stroke-width="1.4"/><rect x="830.5" y="102.0" width="3.5" height="56.599999999999994" rx="2" fill="#2f7d52" fill-opacity="1.0" stroke="#2f7d52" stroke-width="0"/><text x="844.5" y="114.0" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" fill="#16202b" text-anchor="start" font-weight="700">ping-validate.sh</text><text x="844.5" y="132.0" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="10" fill="#5a6b7a" text-anchor="start" font-weight="400">Mode-aware read-only health checks — 23/23</text><text x="844.5" y="146.5" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="10" fill="#5a6b7a" text-anchor="start" font-weight="400">green in clustered mode across every hop.</text><rect x="40.0" y="182.6" width="249.5" height="76.6" rx="8" fill="#ffffff" fill-opacity="1.0" stroke="#c9d5de" stroke-width="1.4"/><rect x="40.0" y="192.6" width="3.5" height="56.599999999999994" rx="2" fill="#0e7c86" fill-opacity="1.0" stroke="#0e7c86" stroke-width="0"/><text x="54.0" y="204.6" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" fill="#16202b" text-anchor="start" font-weight="700">ping-monitor.sh</text><text x="54.0" y="222.6" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="10" fill="#5a6b7a" text-anchor="start" font-weight="400">Terminal dashboard: replication, PF cluster,</text><text x="54.0" y="237.1" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="10" fill="#5a6b7a" text-anchor="start" font-weight="400">PF→PD link, LB routing, per-JVM memory.</text><text x="54.0" y="251.6" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="10" fill="#5a6b7a" text-anchor="start" font-weight="400">--watch to loop.</text><rect x="303.5" y="182.6" width="249.5" height="76.6" rx="8" fill="#ffffff" fill-opacity="1.0" stroke="#c9d5de" stroke-width="1.4"/><rect x="303.5" y="192.6" width="3.5" height="56.599999999999994" rx="2" fill="#5b4b9a" fill-opacity="1.0" stroke="#5b4b9a" stroke-width="0"/><text x="317.5" y="204.6" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" fill="#16202b" text-anchor="start" font-weight="700">ping-dashboard.py</text><text x="317.5" y="222.6" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="10" fill="#5a6b7a" text-anchor="start" font-weight="400">Live visual web dashboard on :8600 — topology</text><text x="317.5" y="237.1" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="10" fill="#5a6b7a" text-anchor="start" font-weight="400">and health, auto-refresh, stdlib server, no deps.</text><rect x="567.0" y="182.6" width="249.5" height="76.6" rx="8" fill="#ffffff" fill-opacity="1.0" stroke="#c9d5de" stroke-width="1.4"/><rect x="567.0" y="192.6" width="3.5" height="56.599999999999994" rx="2" fill="#b06a2c" fill-opacity="1.0" stroke="#b06a2c" stroke-width="0"/><text x="581.0" y="204.6" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" fill="#16202b" text-anchor="start" font-weight="700">ping-logs.sh</text><text x="581.0" y="222.6" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="10" fill="#5a6b7a" text-anchor="start" font-weight="400">Tail, follow (-f) or error-filter (-e) any product's</text><text x="581.0" y="237.1" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="10" fill="#5a6b7a" text-anchor="start" font-weight="400">logs by name.</text><rect x="830.5" y="182.6" width="249.5" height="76.6" rx="8" fill="#ffffff" fill-opacity="1.0" stroke="#c9d5de" stroke-width="1.4"/><rect x="830.5" y="192.6" width="3.5" height="56.599999999999994" rx="2" fill="#2f7d52" fill-opacity="1.0" stroke="#2f7d52" stroke-width="0"/><text x="844.5" y="204.6" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" fill="#16202b" text-anchor="start" font-weight="700">ping-test-sso.sh</text><text x="844.5" y="222.6" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="10" fill="#5a6b7a" text-anchor="start" font-weight="400">Drives the end-to-end browser SSO flow and</text><text x="844.5" y="237.1" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="10" fill="#5a6b7a" text-anchor="start" font-weight="400">asserts the injected identity header comes back.</text><rect x="40" y="281.2" width="1040" height="67.25" rx="7" fill="#f4f3fa" fill-opacity="1.0" stroke="#f4f3fa" stroke-width="0"/><rect x="40" y="281.2" width="4" height="67.25" rx="2" fill="#5b4b9a" fill-opacity="1.0" stroke="#5b4b9a" stroke-width="0"/><text x="58" y="301.2" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="10.5" fill="#5b4b9a" text-anchor="start" font-weight="700">Whole-system lifecycle</text><text x="58" y="316.95" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="10.5" fill="#16202b" text-anchor="start" font-weight="400">ping-control.sh start all brings the stack up in dependency order (pd → pd2 → pf → pf2 → pa → app → lb); stop reverses it. Each PingFederate node is matched by its pf.home, so bouncing the console never touches the</text><text x="58" y="332.175" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="10.5" fill="#16202b" text-anchor="start" font-weight="400">engine.</text></svg>