<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="820" viewBox="0 0 1120 820" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif"><title>End-to-end SSO the installer proves</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1 L9,5 L0,9 z" fill="#5a6b7a"/></marker><marker id="as" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M9,1 L0,5 L9,9 z" fill="#5a6b7a"/></marker></defs><rect width="1120" height="820" fill="#ffffff"/><text x="560.0" y="32" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="17" fill="#16202b" text-anchor="middle" font-weight="700">One login, end to end</text><text x="560.0" y="50" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="11" fill="#8b9aa8" text-anchor="middle" font-weight="400" font-style="italic">What the installer proves: a browser reaches the protected app and comes back with an injected identity</text><rect x="65.0" y="78" width="210" height="42" rx="7" fill="#ffffff" fill-opacity="1.0" stroke="#5a6b7a" stroke-width="1.5"/><text x="170.0" y="104.0" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12.5" fill="#16202b" text-anchor="middle" font-weight="600">Browser</text><path d="M 170.0 120 L 170.0 678" fill="none" stroke="#c9d5de" stroke-width="1.4" stroke-opacity="1.0" stroke-dasharray="4 5"/><rect x="325.0" y="78" width="210" height="42" rx="7" fill="#f7ede2" fill-opacity="1.0" stroke="#b06a2c" stroke-width="1.5"/><text x="430.0" y="104.0" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12.5" fill="#16202b" text-anchor="middle" font-weight="600">PingAccess</text><path d="M 430.0 120 L 430.0 678" fill="none" stroke="#c9d5de" stroke-width="1.4" stroke-opacity="1.0" stroke-dasharray="4 5"/><rect x="585.0" y="78" width="210" height="42" rx="7" fill="#e2f1f2" fill-opacity="1.0" stroke="#0e7c86" stroke-width="1.5"/><text x="690.0" y="104.0" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12.5" fill="#16202b" text-anchor="middle" font-weight="600">PingFederate</text><path d="M 690.0 120 L 690.0 678" fill="none" stroke="#c9d5de" stroke-width="1.4" stroke-opacity="1.0" stroke-dasharray="4 5"/><rect x="845.0" y="78" width="210" height="42" rx="7" fill="#e7f3ec" fill-opacity="1.0" stroke="#2f7d52" stroke-width="1.5"/><text x="950.0" y="104.0" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12.5" fill="#16202b" text-anchor="middle" font-weight="600">PingDirectory</text><path d="M 950.0 120 L 950.0 678" fill="none" stroke="#c9d5de" stroke-width="1.4" stroke-opacity="1.0" stroke-dasharray="4 5"/><line x1="170.0" y1="138" x2="430.0" y2="138" stroke="#5a6b7a" stroke-width="1.7" stroke-opacity="1.0" marker-end="url(#a)"/><rect x="205.05" y="118" width="189.9" height="17" rx="4" fill="#ffffff" fill-opacity="1.0" stroke="#ffffff" stroke-width="0"/><text x="300.0" y="130.5" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="10.5" fill="#5a6b7a" text-anchor="middle" font-weight="600">1  GET https://app.example.com/</text><line x1="430.0" y1="176" x2="170.0" y2="176" stroke="#5a6b7a" stroke-width="1.7" stroke-opacity="1.0" stroke-dasharray="5 4" marker-end="url(#a)"/><rect x="193.25" y="156" width="213.5" height="17" rx="4" fill="#ffffff" fill-opacity="1.0" stroke="#ffffff" stroke-width="0"/><text x="300.0" y="168.5" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="10.5" fill="#5a6b7a" text-anchor="middle" font-weight="600">2  302 to PingFederate (no session)</text><line x1="170.0" y1="214" x2="690.0" y2="214" stroke="#5a6b7a" stroke-width="1.7" stroke-opacity="1.0" marker-end="url(#a)"/><rect x="290.79999999999995" y="194" width="278.40000000000003" height="17" rx="4" fill="#ffffff" fill-opacity="1.0" stroke="#ffffff" stroke-width="0"/><text x="430.0" y="206.5" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="10.5" fill="#5a6b7a" text-anchor="middle" font-weight="600">3  follow redirect to /as/authorization.oauth2</text><line x1="690.0" y1="252" x2="170.0" y2="252" stroke="#5a6b7a" stroke-width="1.7" stroke-opacity="1.0" stroke-dasharray="5 4" marker-end="url(#a)"/><rect x="373.4" y="232" width="113.2" height="17" rx="4" fill="#ffffff" fill-opacity="1.0" stroke="#ffffff" stroke-width="0"/><text x="430.0" y="244.5" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="10.5" fill="#5a6b7a" text-anchor="middle" font-weight="600">4  HTML login form</text><line x1="170.0" y1="290" x2="690.0" y2="290" stroke="#5a6b7a" stroke-width="1.7" stroke-opacity="1.0" marker-end="url(#a)"/><rect x="343.9" y="270" width="172.20000000000002" height="17" rx="4" fill="#ffffff" fill-opacity="1.0" stroke="#ffffff" stroke-width="0"/><text x="430.0" y="282.5" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="10.5" fill="#5a6b7a" text-anchor="middle" font-weight="600">5  POST testuser1 / password</text><line x1="690.0" y1="328" x2="950.0" y2="328" stroke="#5a6b7a" stroke-width="1.7" stroke-opacity="1.0" marker-end="url(#a)"/><rect x="660.15" y="308" width="319.70000000000005" height="17" rx="4" fill="#ffffff" fill-opacity="1.0" stroke="#ffffff" stroke-width="0"/><text x="820.0" y="320.5" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="10.5" fill="#5a6b7a" text-anchor="middle" font-weight="600">6  authenticate: validate credentials (bind + search)</text><line x1="950.0" y1="366" x2="690.0" y2="366" stroke="#5a6b7a" stroke-width="1.7" stroke-opacity="1.0" stroke-dasharray="5 4" marker-end="url(#a)"/><rect x="713.25" y="346" width="213.5" height="17" rx="4" fill="#ffffff" fill-opacity="1.0" stroke="#ffffff" stroke-width="0"/><text x="820.0" y="358.5" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="10.5" fill="#5a6b7a" text-anchor="middle" font-weight="600">7  user verified; write SSO session</text><line x1="690.0" y1="404" x2="170.0" y2="404" stroke="#5a6b7a" stroke-width="1.7" stroke-opacity="1.0" marker-end="url(#a)"/><rect x="338.0" y="384" width="184.0" height="17" rx="4" fill="#ffffff" fill-opacity="1.0" stroke="#ffffff" stroke-width="0"/><text x="430.0" y="396.5" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="10.5" fill="#5a6b7a" text-anchor="middle" font-weight="600">8  302 back to app with ?code=</text><line x1="170.0" y1="442" x2="430.0" y2="442" stroke="#5a6b7a" stroke-width="1.7" stroke-opacity="1.0" marker-end="url(#a)"/><rect x="208.0" y="422" width="184.0" height="17" rx="4" fill="#ffffff" fill-opacity="1.0" stroke="#ffffff" stroke-width="0"/><text x="300.0" y="434.5" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="10.5" fill="#5a6b7a" text-anchor="middle" font-weight="600">9  deliver code to /pa/oidc/cb</text><line x1="430.0" y1="480" x2="690.0" y2="480" stroke="#5a6b7a" stroke-width="1.7" stroke-opacity="1.0" marker-end="url(#a)"/><rect x="473.9" y="460" width="172.20000000000002" height="17" rx="4" fill="#ffffff" fill-opacity="1.0" stroke="#ffffff" stroke-width="0"/><text x="560.0" y="472.5" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="10.5" fill="#5a6b7a" text-anchor="middle" font-weight="600">10  exchange code for tokens</text><line x1="690.0" y1="518" x2="950.0" y2="518" stroke="#5a6b7a" stroke-width="1.7" stroke-opacity="1.0" marker-end="url(#a)"/><rect x="698.5" y="498" width="243.0" height="17" rx="4" fill="#ffffff" fill-opacity="1.0" stroke="#ffffff" stroke-width="0"/><text x="820.0" y="510.5" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="10.5" fill="#5a6b7a" text-anchor="middle" font-weight="600">11  read attributes for the token claims</text><line x1="950.0" y1="556" x2="690.0" y2="556" stroke="#5a6b7a" stroke-width="1.7" stroke-opacity="1.0" stroke-dasharray="5 4" marker-end="url(#a)"/><rect x="748.65" y="536" width="142.70000000000002" height="17" rx="4" fill="#ffffff" fill-opacity="1.0" stroke="#ffffff" stroke-width="0"/><text x="820.0" y="548.5" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="10.5" fill="#5a6b7a" text-anchor="middle" font-weight="600">12  attributes returned</text><line x1="690.0" y1="594" x2="430.0" y2="594" stroke="#5a6b7a" stroke-width="1.7" stroke-opacity="1.0" stroke-dasharray="5 4" marker-end="url(#a)"/><rect x="491.6" y="574" width="136.8" height="17" rx="4" fill="#ffffff" fill-opacity="1.0" stroke="#ffffff" stroke-width="0"/><text x="560.0" y="586.5" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="10.5" fill="#5a6b7a" text-anchor="middle" font-weight="600">13  id + access tokens</text><line x1="430.0" y1="632" x2="170.0" y2="632" stroke="#5a6b7a" stroke-width="1.7" stroke-opacity="1.0" stroke-dasharray="5 4" marker-end="url(#a)"/><rect x="190.3" y="612" width="219.4" height="17" rx="4" fill="#ffffff" fill-opacity="1.0" stroke="#ffffff" stroke-width="0"/><text x="300.0" y="624.5" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="10.5" fill="#5a6b7a" text-anchor="middle" font-weight="600">14  200, app shows X-USER: testuser1</text><rect x="40" y="694" width="1040" height="67.25" rx="7" fill="#e7f3ec" fill-opacity="1.0" stroke="#e7f3ec" stroke-width="0"/><rect x="40" y="694" width="4" height="67.25" rx="2" fill="#2f7d52" fill-opacity="1.0" stroke="#2f7d52" stroke-width="0"/><text x="58" y="714" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="10.5" fill="#2f7d52" text-anchor="start" font-weight="700">Two hits, one directory: authenticate, then read attributes</text><text x="58" y="729.75" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="10.5" fill="#16202b" text-anchor="start" font-weight="400">PingFederate reaches PingDirectory twice: once to validate the credentials at login, and again at token issuance to read the attributes that become token claims. Authentication and attribute retrieval are logically</text><text x="58" y="744.975" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="10.5" fill="#16202b" text-anchor="start" font-weight="400">separate sources; here they are the same directory. The SSO session written mid-flow lands in ou=AuthenticationSessions, durable across restarts and present on both nodes when clustered.</text></svg>