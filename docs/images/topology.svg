<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="780" viewBox="0 0 1120 780" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif"><title>Platform topology</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1 L9,5 L0,9 z" fill="#5a6b7a"/></marker><marker id="as" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M9,1 L0,5 L9,9 z" fill="#5a6b7a"/></marker></defs><rect width="1120" height="780" fill="#ffffff"/><text x="560.0" y="32" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="17" fill="#16202b" text-anchor="middle" font-weight="700">One topology; HA is the only difference</text><text x="560.0" y="50" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="11" fill="#8b9aa8" text-anchor="middle" font-weight="400" font-style="italic">Everything is behind the load balancer. HA sets how many PingFederate and PingDirectory nodes sit behind it — dashed = added by HA=true</text><rect x="440.0" y="66" width="240" height="42" rx="7" fill="#ffffff" fill-opacity="1.0" stroke="#5a6b7a" stroke-width="1.5"/><text x="560.0" y="84.0" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12.5" fill="#16202b" text-anchor="middle" font-weight="600">Browser</text><text x="560.0" y="101.0" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="9.5" fill="#5a6b7a" text-anchor="middle" font-weight="400">https · :443</text><rect x="330.0" y="138" width="460" height="58" rx="7" fill="#ecebf6" fill-opacity="1.0" stroke="#5b4b9a" stroke-width="1.5"/><text x="560.0" y="164.0" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13.5" fill="#16202b" text-anchor="middle" font-weight="600">HAProxy load balancer</text><text x="560.0" y="181.0" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="10" fill="#5a6b7a" text-anchor="middle" font-weight="400">single front door on :443 · routes by Host · app.example.com + ping.example.com</text><line x1="560.0" y1="108" x2="560.0" y2="138" stroke="#5a6b7a" stroke-width="1.8" stroke-opacity="1.0" marker-end="url(#a)"/><rect x="90" y="282" width="300" height="84" rx="7" fill="#f7ede2" fill-opacity="1.0" stroke="#b06a2c" stroke-width="1.5"/><text x="240.0" y="321.0" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13.5" fill="#16202b" text-anchor="middle" font-weight="600">PingAccess</text><text x="240.0" y="338.0" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="10" fill="#5a6b7a" text-anchor="middle" font-weight="400">engine :3000 · protects the app</text><rect x="470" y="260" width="560" height="122" rx="11" fill="#f6f9fb" fill-opacity="1.0" stroke="#0e7c86" stroke-width="1.6"/><text x="486" y="282" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="11.5" fill="#5a6b7a" text-anchor="start" font-weight="700" letter-spacing="0.10em">PINGFEDERATE</text><rect x="490" y="288" width="250" height="66" rx="7" fill="#e2f1f2" fill-opacity="1.0" stroke="#0e7c86" stroke-width="1.5"/><text x="615.0" y="318.0" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12.5" fill="#16202b" text-anchor="middle" font-weight="600">node 1</text><text x="615.0" y="335.0" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="9.5" fill="#5a6b7a" text-anchor="middle" font-weight="400">always on</text><rect x="760" y="288" width="250" height="66" rx="7" fill="#e2f1f2" fill-opacity="1.0" stroke="#0e7c86" stroke-width="1.5" stroke-dasharray="5 4"/><text x="885.0" y="318.0" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12.5" fill="#16202b" text-anchor="middle" font-weight="600">node 2</text><text x="885.0" y="335.0" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="9.5" fill="#5a6b7a" text-anchor="middle" font-weight="400">adds an engine</text><rect x="981.6" y="295" width="20.4" height="17" rx="5" fill="#fff" fill-opacity="1.0" stroke="#0e7c86" stroke-width="1.2"/><text x="991.8" y="307" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="9.5" fill="#0e7c86" text-anchor="middle" font-weight="700" letter-spacing="0.06em">HA</text><path d="M 740 321 L 760 321" fill="none" stroke="#0e7c86" stroke-width="1.5" stroke-opacity="1.0" stroke-dasharray="5 4" marker-end="url(#a)" marker-start="url(#as)"/><rect x="725.85" y="300" width="48.300000000000004" height="17" rx="4" fill="#ffffff" fill-opacity="1.0" stroke="#ffffff" stroke-width="0"/><text x="750" y="312.5" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="10.5" fill="#5a6b7a" text-anchor="middle" font-weight="600">cluster</text><path d="M 400.0 196 L 400.0 232 L 240 232 L 240 282" fill="none" stroke="#5a6b7a" stroke-width="1.6" stroke-opacity="1.0" marker-end="url(#a)"/><rect x="262.25" y="221" width="95.5" height="17" rx="4" fill="#ffffff" fill-opacity="1.0" stroke="#ffffff" stroke-width="0"/><text x="310" y="233.5" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="10.5" fill="#5a6b7a" text-anchor="middle" font-weight="600">app.example.com</text><path d="M 720.0 196 L 720.0 232 L 890 232 L 890 260" fill="none" stroke="#5a6b7a" stroke-width="1.6" stroke-opacity="1.0" marker-end="url(#a)"/><rect x="769.3" y="221" width="101.4" height="17" rx="4" fill="#ffffff" fill-opacity="1.0" stroke="#ffffff" stroke-width="0"/><text x="820" y="233.5" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="10.5" fill="#5a6b7a" text-anchor="middle" font-weight="600">ping.example.com</text><path d="M 390 312 L 430 312 L 430 196" fill="none" stroke="#b06a2c" stroke-width="1.5" stroke-opacity="1.0" stroke-dasharray="5 4" marker-end="url(#a)"/><rect x="429.2" y="291" width="89.60000000000001" height="17" rx="4" fill="#ffffff" fill-opacity="1.0" stroke="#ffffff" stroke-width="0"/><text x="474" y="303.5" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="10.5" fill="#5a6b7a" text-anchor="middle" font-weight="600">token provider</text><rect x="367.5" y="203" width="125.0" height="17" rx="4" fill="#ffffff" fill-opacity="1.0" stroke="#ffffff" stroke-width="0"/><text x="430" y="215.5" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="10.5" fill="#5a6b7a" text-anchor="middle" font-weight="600">via ping.example.com</text><rect x="300" y="500" width="520" height="150" rx="11" fill="#f6f9fb" fill-opacity="1.0" stroke="#2f7d52" stroke-width="1.6"/><text x="316" y="522" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="11.5" fill="#5a6b7a" text-anchor="start" font-weight="700" letter-spacing="0.10em">PINGDIRECTORY</text><rect x="322" y="540" width="230" height="84" rx="7" fill="#e7f3ec" fill-opacity="1.0" stroke="#2f7d52" stroke-width="1.5"/><text x="437.0" y="579.0" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" fill="#16202b" text-anchor="middle" font-weight="600">node 1</text><text x="437.0" y="596.0" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="10" fill="#5a6b7a" text-anchor="middle" font-weight="400">LDAPS :1636</text><rect x="568" y="540" width="230" height="84" rx="7" fill="#e7f3ec" fill-opacity="1.0" stroke="#2f7d52" stroke-width="1.5" stroke-dasharray="5 4"/><text x="683.0" y="579.0" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" fill="#16202b" text-anchor="middle" font-weight="600">node 2</text><text x="683.0" y="596.0" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="10" fill="#5a6b7a" text-anchor="middle" font-weight="400">LDAPS :2636</text><rect x="769.6" y="547" width="20.4" height="17" rx="5" fill="#fff" fill-opacity="1.0" stroke="#2f7d52" stroke-width="1.2"/><text x="779.8" y="559" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="9.5" fill="#2f7d52" text-anchor="middle" font-weight="700" letter-spacing="0.06em">HA</text><path d="M 552 582 L 568 582" fill="none" stroke="#2f7d52" stroke-width="2" stroke-opacity="1.0" stroke-dasharray="5 4" marker-end="url(#a)" marker-start="url(#as)"/><rect x="524.05" y="561" width="71.9" height="17" rx="4" fill="#ffffff" fill-opacity="1.0" stroke="#ffffff" stroke-width="0"/><text x="560" y="573.5" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="10.5" fill="#5a6b7a" text-anchor="middle" font-weight="600">replication</text><text x="560" y="638" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="11" fill="#8b9aa8" text-anchor="middle" font-weight="400" font-style="italic">each node holds users · sessions · grants</text><path d="M 750 382 L 750 472 L 437 472 L 437 538" fill="none" stroke="#0e7c86" stroke-width="1.5" stroke-opacity="1.0" marker-end="url(#a)"/><path d="M 750 382 L 750 472 L 683 472 L 683 538" fill="none" stroke="#0e7c86" stroke-width="1.5" stroke-opacity="1.0" stroke-dasharray="5 4" marker-end="url(#a)"/><rect x="470.95" y="461" width="178.10000000000002" height="17" rx="4" fill="#ffffff" fill-opacity="1.0" stroke="#ffffff" stroke-width="0"/><text x="560" y="473.5" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="10.5" fill="#5a6b7a" text-anchor="middle" font-weight="600">LDAPS direct · failover in HA</text><rect x="40" y="700" width="1040" height="67.25" rx="7" fill="#f4f3fa" fill-opacity="1.0" stroke="#f4f3fa" stroke-width="0"/><rect x="40" y="700" width="4" height="67.25" rx="2" fill="#5b4b9a" fill-opacity="1.0" stroke="#5b4b9a" stroke-width="0"/><text x="58" y="720" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="10.5" fill="#5b4b9a" text-anchor="start" font-weight="700">Everything through the front door</text><text x="58" y="735.75" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="10.5" fill="#16202b" text-anchor="start" font-weight="400">PingAccess sits behind the load balancer and reaches PingFederate through it, at ping.example.com — never an engine node directly, so failover and scaling are transparent. HA=false is node 1 of each; HA=true</text><text x="58" y="750.975" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="10.5" fill="#16202b" text-anchor="start" font-weight="400">adds the dashed second node: PingFederate becomes a console + engine cluster and PingDirectory replicates, with the PF-to-PD link failing over across both directory nodes over LDAPS.</text></svg>